name: Desktop release builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - pubspec.yaml
      - .github/workflows/desktop-release.yml

permissions:
  contents: write

jobs:
  macos:
    name: macOS universal app
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Verify Dart code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package macOS app
        run: |
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml | tr '+' '-')
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/ccs_mobile_studio.app" \
            "build/CCS-Mobile-Studio-${VERSION}-macOS-universal.zip"
          echo "DESKTOP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: CCS-Mobile-Studio-${{ env.DESKTOP_VERSION }}-macOS-universal
          path: build/CCS-Mobile-Studio-${{ env.DESKTOP_VERSION }}-macOS-universal.zip
          if-no-files-found: error

  android:
    name: Android universal APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure stable Android release signing
        id: android-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CCS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CCS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CCS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || \
             [ -z "$CCS_ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$CCS_ANDROID_KEY_ALIAS" ] || \
             [ -z "$CCS_ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::Android APK skipped: stable release-signing secrets are not configured"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
            echo "CCS_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release-key.jks" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.android-signing.outputs.enabled == 'true'
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Install Android NDK and Rust targets
        if: steps.android-signing.outputs.enabled == 'true'
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Resolve Flutter packages
        if: steps.android-signing.outputs.enabled == 'true'
        run: flutter pub get

      - name: Build Android native core
        if: steps.android-signing.outputs.enabled == 'true'
        run: ./rust/build_android.sh

      - name: Build Android release APK
        if: steps.android-signing.outputs.enabled == 'true'
        env:
          CCS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CCS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CCS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Package Android APK
        if: steps.android-signing.outputs.enabled == 'true'
        run: |
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml | tr '+' '-')
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/CCS-Mobile-Studio-${VERSION}-Android.apk"
          echo "DESKTOP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: steps.android-signing.outputs.enabled == 'true'
        with:
          name: CCS-Mobile-Studio-${{ env.DESKTOP_VERSION }}-Android
          path: build/CCS-Mobile-Studio-${{ env.DESKTOP_VERSION }}-Android.apk
          if-no-files-found: error

  windows:
    name: Windows x64 app
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Verify Dart code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows app
        shell: pwsh
        run: |
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value).Replace('+', '-')
          $archive = "build/CCS-Mobile-Studio-$version-Windows-x64.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $archive
          "DESKTOP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: CCS-Mobile-Studio-${{ env.DESKTOP_VERSION }}-Windows-x64
          path: build/CCS-Mobile-Studio-${{ env.DESKTOP_VERSION }}-Windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [macos, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: CCS-Mobile-Studio-*
          path: release-assets
          merge-multiple: true

      - name: Publish versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          TAG="v${PACKAGE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "CCS Mobile Studio ${PACKAGE_VERSION}" \
              --generate-notes
          fi

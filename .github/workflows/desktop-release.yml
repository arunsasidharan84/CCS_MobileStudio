name: Desktop release builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - pubspec.yaml
      - .github/workflows/desktop-release.yml

permissions:
  contents: write

jobs:
  macos:
    name: macOS universal app
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Verify Dart code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build macOS release
        run: flutter build macos --release

      - name: Configure macOS signing and notarization
        id: macos-signing
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_BASE64" ] || [ -z "$MACOS_CERTIFICATE_PWD" ]; then
            echo "::warning::macOS Developer ID signing skipped: certificate secrets not configured"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            KEYCHAIN_PWD=$(openssl rand -base64 12)
            security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
            security default-keychain -s "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
            security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
            echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
            security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          fi

      - name: Sign and Notarize macOS app
        if: steps.macos-signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk -F '"' '{print $2}')
          if [ -n "$IDENTITY" ]; then
            echo "Signing app with $IDENTITY"
            codesign --deep --force --options runtime --timestamp --sign "$IDENTITY" "build/macos/Build/Products/Release/CCS Mobile Studio.app"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "Submitting to Apple Notary Service..."
              ditto -c -k --keepParent "build/macos/Build/Products/Release/CCS Mobile Studio.app" "$RUNNER_TEMP/notarize.zip"
              xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --wait
              xcrun stapler staple "build/macos/Build/Products/Release/CCS Mobile Studio.app"
              echo "Notarization ticket stapled successfully."
            fi
          fi

      - name: Package macOS app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/CCS Mobile Studio.app" \
            "dist/CCSMobileStudio-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: CCSMobileStudio-macos
          path: dist/CCSMobileStudio-macos.zip
          if-no-files-found: error

  android:
    name: Android universal APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure stable Android release signing
        id: android-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CCS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CCS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CCS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || \
             [ -z "$CCS_ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$CCS_ANDROID_KEY_ALIAS" ] || \
             [ -z "$CCS_ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::Android APK will build with default signing (release keystore secrets not configured)"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
            echo "CCS_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release-key.jks" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.android-signing.outputs.enabled == 'true'
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Install Android NDK and Rust targets
        if: steps.android-signing.outputs.enabled == 'true'
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Resolve Flutter packages
        if: steps.android-signing.outputs.enabled == 'true'
        run: flutter pub get

      - name: Build Android native core
        if: steps.android-signing.outputs.enabled == 'true'
        run: ./rust/build_android.sh

      - name: Build Android release APK
        if: steps.android-signing.outputs.enabled == 'true'
        env:
          CCS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CCS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CCS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Package Android APK
        if: steps.android-signing.outputs.enabled == 'true'
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/CCSMobileStudio-Android.apk"

      - uses: actions/upload-artifact@v4
        if: steps.android-signing.outputs.enabled == 'true'
        with:
          name: CCSMobileStudio-Android
          path: dist/CCSMobileStudio-Android.apk
          if-no-files-found: error

  windows:
    name: Windows x64 app
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Verify Dart code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows app
        shell: pwsh
        run: |
          mkdir -p dist
          $archive = "dist/CCSMobileStudio-Windows.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $archive

      - uses: actions/upload-artifact@v4
        with:
          name: CCSMobileStudio-Windows
          path: dist/CCSMobileStudio-Windows.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [macos, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: CCSMobileStudio-*
          path: release-assets
          merge-multiple: true

      - name: Publish versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          TAG="v${PACKAGE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "CCS Mobile Studio ${PACKAGE_VERSION}" \
              --generate-notes
          fi
